name: Build Wine-NX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arquitetura
        run: |
          uname -m
          docker version

      - name: Testar devkitPro
        run: |
          docker run --rm devkitpro/devkita64:latest uname -m

      - name: Compilar
        run: |
          chmod +x wine-nx-probe/*.sh
          ./wine-nx-probe/build-wow64-dynarec.sh

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-nx-build
          path: |
            **/*.nro
            **/*.zip
          if-no-files-found: warn
