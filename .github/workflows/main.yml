name: Build Wine-NX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verificar ambiente
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITPRO/devkitA64"
          cmake --version
          make --version

      - name: Verificar launcher
        run: |
          test -f wine-nx-probe/source/launcher.c
          echo "launcher.c encontrado"

      - name: Compilar
        run: |
          cd wine-nx-probe
          chmod +x *.sh
          ./build-wow64-dynarec.sh

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-nx-build
          path: |
            wine-nx-probe/**/*.nro
            wine-nx-probe/**/*.zip
          if-no-files-found: warn
